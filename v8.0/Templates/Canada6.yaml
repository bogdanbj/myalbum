  - no: "5"
    title: Canada Day 1984 - Miniature Sheet
    children:
      - type: row
        height: 10
      - type: row
        height: 20
      - type: row
        children:
          - type: stamp
            width: 138
            height: 124
            i1: 12 x 32c
            i3: S 1027a
            f2: Paintings by Jean Paul Lemieux
      - type: row
        height: 4
      - type: row
        children:
          - type: text
            style: story
            width: 130
            content: "A vision of Canada by one of her most respected and talented artists is the theme of the 1984 Canada Day miniature sheet. This year's commemorative sheet reproduces the work of the Quebec artist as part of the celebrations marking the 450th anniversary of Jacques Cartier's arrival in Canada. The Canada Day stamps feature twelve paintings, which were conceived as a set, giving the artist's interpretation of the provinces and territories of Canada."

  - no: "6"
    title: Commemorative 1984
    children:
      - type: row
        height: 10
      - type: row
        space: 40
        valign: top
        children:
          - type: column
            width: 36
            rem: New Brunswick Bicentennial
            children:
              - type: text
                style: headline
                content: NEW BRUNSWICK BICENTENNIAL
              - type: text
                style: date
                content: "1984"
              - type: stamp
                width: 30
                height: 36
                i1: 32c
                i3: S 1014
                f2: "'Lymphad' sailing vessels"
              - type: text
                style: story
                width: 40
                content: "The stamp commemorates 200 years since the creation of the \"Colony of New Brunswick\". The Scottish Lymphads represent shipbuilding, one of the province's main industries throughout much of its history."
          - type: column
            width: 36
            rem: Roman Catholic Church
            children:
              - type: text
                style: headline
                content: ROMAN CATHOLIC CHURCH
              - type: text
                style: date
                content: "1984"
              - type: stamp
                width: 30
                height: 36
                i1: 32c
                i3: S 1029
                f2: "Basilica of St. John's,\nNewfoundland"
              - type: text
                style: story
                width: 40
                content: "The arrival of Father James O'Donnell, a Franciscan, in 1784 marked the formal establishment of the English-speaking Roman Catholic Church in Newfoundland and in North America."
      - type: row
        height: 15
      - type: row
        rem: Christmas
        children:
          - type: column
            width: 36
            children:
              - type: text
                style: headline
                content: CHRISTMAS
              - type: text
                style: date
                content: "1984"
              - type: row
                space: 10
                valign: bottom
                children:
                  - type: stamp
                    width: 33
                    height: 30
                    i1: 32c
                    i3: S 1040
                    f2: "L'Annonciation,\nby Jean Dallaire"
                  - type: stamp
                    width: 33
                    height: 30
                    i1: 37c
                    i3: S 1041
                    f2: "The Three Kings,\nby Simone Bouchard"
                  - type: stamp
                    width: 33
                    height: 30
                    i1: 64c
                    i3: S 1042
                    f2: "Snow in Bethlehem,\nby David Milne"
              - type: text
                style: story
                width: 130
                content: "Religious painting filled a pressing need for church decoration in the seventeenth century. In the eighteenth and nineteenth centuries, painters moved away from religious themes, and in the twentieth century their works were enlivened by various fashionable styles. But the Christmas theme still returns with freshness and spontaneity, as we can see from these paintings by Canadian artists."

  - no: "7"
    title: Canadian Lighthouses
    style: landscape
    children:
      - type: row
        height: 10
      - type: row
        space: 16
        rem: Canadian Lighthouses
        children:
          - type: column
            width: 100
            children:
              - type: text
                style: headline
                content: CANADIAN LIGHTHOUSES
      - type: row
        height: 10
      - type: row
        space: 15
        valign: bottom
        children:
          - type: column
            width: 86
            space: 5
            align: left
            children:
              - type: row
                children:
                  - type: column
                    width: 86
                    children:
                      - type: text
                        style: date
                        content: "1984"
                      - type: stamp
                        width: 80
                        height: 48
                        i1: 32c
                        i3: S 1032-1035
                        f2: Historic Lighthouses
              - type: row
                children:
                  - type: column
                    width: 78
                    children:
                      - type: text
                        style: date
                        content: "1985"
                      - type: stamp
                        width: 72
                        height: 60
                        i1: 34c
                        i3: S 1063-1066
                        f2: Modern Lighthouses
                  - type: column
                    width: 2
          - type: column
            width: 114
            children:
              - type: text
                style: story
                width: 114
                align: left
                content: "Today's lighthouses warn sailors of shoals and dangerous shorelines under all weather conditions. Day and night, rain or shine, these stations stand out from their surroundings with contrasting forms and colours, making their presence known by powerful beacons and foghorns. Many also emit radio or radar signals.\n\nIn 1984, on the occasion of the 250th anniversary of the completion of Louisbourg, the first Canadian lighthouse, Canada Post initiated a two-years series dedicated to the Canadian lighthouses. The stamps issued in 1984 feature the oldest lighthouses on the East Coast, the St. Lawrence River, the Great Lakes, and the West Coast while the 1985 issue illustrates four modern navigational aid stations."
              - type: row
                height: 10
              - type: text
                style: date
                content: "1985"
              - type: stamp
                width: 108
                height: 90
                i3: S 1066b
          - type: column
            width: 0
      - type: row
