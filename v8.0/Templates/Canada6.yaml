  - no: "2"
    title: Commemorative 1984
    children:
      - type: row
        height: 10
      - type: row
        space: 20
        valign: bottom
        children:
          - type: column
            width: 36
            rem: Yellowknife
            children:
              - type: text
                style: headline
                content: YELLOWKNIFE
              - type: text
                style: date
                content: "1984"
              - type: stamp
                width: 30
                height: 36
                i1: 32c
                i3: S 1009
                f2: Gold mine head frame in pan
              - type: text
                style: story
                width: 40
                content: "The stamp issued on 15 May 1984, commemorates the 50th anniversary of the gold mining community living in the city of Yellowknife, capital of Northwest Territories."
          - type: column
            width: 36
            rem: Tall Ships
            children:
              - type: text
                style: headline
                content: TALL SHIPS
              - type: text
                style: date
                content: "1984"
              - type: stamp
                width: 30
                height: 40
                i1: 32c
                i3: S 1012
                f2: Tall Ships regatta
              - type: text
                style: story
                width: 40
                content: "Over 85 of majestic two, three and four-masted ships dropped anchor in St. Lawrence River in Quebec City honouring the 450th anniversary of Jacques Cartier's first voyage to North America."
          - type: column
            width: 36
            rem: Canadian Red Cross
            children:
              - type: text
                style: headline
                content: RED CROSS
              - type: text
                style: date
                content: "1984"
              - type: stamp
                width: 30
                height: 36
                i1: 32c
                i3: S 1013
                f2: Meritorious Service Medal
              - type: text
                style: story
                width: 40
                content: "In recognition of their invaluable contribution, Canada Post issued this stamp featuring the medal awarded by The Canadian Red Cross Society for long-standing and meritorious voluntary service."
      - type: row
        height: 10
      - type: row
        space: 14
        valign: bottom
        children:
          - type: column
            width: 46
            rem: Montreal Symphony
            children:
              - type: text
                style: headline
                content: MONTREAL SYMPHONY
              - type: text
                style: date
                content: "1984"
              - type: stamp
                width: 40
                height: 24
                i1: 32c
                i3: S 1010
                f2: Orchestra concert
              - type: text
                style: story
                width: 40
                content: "The Montreal Symphony Orchestra, one of the largest principal orchestras in Canada, was founded in 1934 in the middle of the Great Depression by enthusiastic Quebec musicians.\n\n"
          - type: column
            width: 36
            rem: Treffle Berthiaume
            children:
              - type: text
                style: headline
                content: TREFFLÉ BERTHIAUME
              - type: text
                style: date
                content: "1984"
              - type: stamp
                width: 26
                height: 40
                i1: 32c
                i3: S 1044
                f2: Trefflé Berthiaume
              - type: text
                style: story
                width: 40
                content: "Trefflé Berthiaume (1848-1915), was a Canadian newspaperman and politician. As the owner of the Montreal newspaper \"La Presse\" he championed many social causes, including improved conditions for workers and aid to children and the needy."
          - type: column
            width: 46
            rem: United Empire Loyalists
            children:
              - type: text
                style: headline
                content: UNITED EMPIRE LOYALISTS
              - type: text
                style: date
                content: "1984"
              - type: stamp
                width: 40
                height: 24
                i1: 32c
                i3: S 1028
                f2: Loyalists and British flag
              - type: text
                style: story
                width: 40
                content: "Approximately 100,000 Loyalists fled the United Stated, at the end of American Revolution, about half of them in Canada contributing substantially to the pioneering efforts.\n\n"

  - no: "3"
    title: Commemorative 1984
    children:
      - type: row
        height: 10
      - type: row
        space: 8
        rem: St. Lawrence Seaway
        children:
          - type: column
            width: 46
            children:
              - type: text
                style: headline
                content: ST. LAWRENCE SEAWAY
              - type: text
                style: date
                content: "1984"
          - type: stamp
            width: 56
            height: 26
            i1: 32c
            i3: S 1015
            f2: The navigable waterway of St. Lawrence Seaway
          - type: stamp
            width: 40
            height: 25
            i1: 20c
            i3: S 2091(US)
            f2: Joint issue with US
      - type: row
        children:
          - type: text
            style: story
            width: 170
            content: "The St. Lawrence River connects the Atlantic Ocean to the farthest reaches of Lake Superior, 3750 km away and 200 m above sea level. The joint effort of Canada and the United States created 2,000 MW in electrical power and replaced the existing \"fourteen foot\" waterway by a channel nine metres deep with half the locks previously needed. The Seaway was officially opened on 26 June 1959."
      - type: row
        height: 20
      - type: row
        space: 16
        rem: Jaques Cartier
        children:
          - type: column
            width: 46
            children:
              - type: text
                style: headline
                content: JACQUES CARTIER
              - type: text
                style: date
                content: "1984"
          - type: stamp
            width: 40
            height: 26
            i1: 32c
            i3: S 1011
            f2: Cartier and ship
          - type: stamp
            width: 40
            height: 26
            i1: 2.00 Fr
            i3: S 1923(Fr)
            f2: Joint issue with France
      - type: row
        children:
          - type: text
            style: story
            width: 170
            content: "The stamps jointly issued by Canada and France commemorates the 450th anniversary of Jacques Cartier's first voyage to Canada. Cartier left Saint-Malo, France, on 20 April 1534 with two ships and 61 men and returned on 5 September 1534. During this voyage Cartier charted the Gulf of Saint Lawrence and tied relations with Iroquoian-Huron peoples."
      - type: row
        height: 20
      - type: row
        space: 16
        rem: Papal Visit
        children:
          - type: column
            width: 46
            children:
              - type: text
                style: headline
                content: PAPAL VISIT
              - type: text
                style: date
                content: "1984"
          - type: stamp
            width: 40
            height: 24
            i1: 32c
            i3: S 1030
            f2: Papal coat-of-arms and map
          - type: stamp
            width: 40
            height: 24
            i1: 64c
            i3: S 1031
            f2: Papal coat-of-arms and map
      - type: row
        space: 8
        children:
          - type: text
            style: story
            width: 170
            content: "This issue commemorates the visit of Pope John Paul II in Canada in September 1984. The stamps feature the Pope personal coats of arms: a blue shield quartered by a gold cross with the letter M, all surmounted by ancient symbols of the papacy: the triple crown and the keys of St. Peter."

